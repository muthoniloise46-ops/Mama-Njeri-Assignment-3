
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Mama Njeri Assignment 3</title>
</head>

<body>

    <!-- Select a Dish Form -->
    <form action="Mama Njeri.html" method="post">

        <label for="dish">Select a dish:</label>
        <input type="text" id="dish" name="dish" required>

    </form>

    <p>Forms</p>

    <!-- Student Registration Form -->
    <form action="Mama Njeri.html" method="post">

        <fieldset>
            <legend>Student Registration</legend>

            <fieldset>
                <legend>Personal Information</legend>

                <label for="firstname">First Name:</label>
                <input type="text" id="firstname" name="firstname" required>
                <br>

                <label for="lastname">Last Name:</label>
                <input type="text" id="lastname" name="lastname" required>
                <br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
                <br>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <br>

                <label for="DOB">Date of Birth:</label>
                <input type="date" id="DOB" name="DOB" required>
                <br>

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

            </fieldset>

            <br>
            <input type="submit" value="Submit">

        </fieldset>

    </form>

    <!-- Inline CSS Styling -->
    <p style="color:rgb(95, 160, 124); background-color:rgb(210, 30, 207)">
        inline styles
    </p>

        </tbody>

    </table>

</body>
